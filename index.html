<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IP Address Tracker</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script defer src="script.js"></script>
</head>
<body>
  <header class="hero">
    <h1>IP Address Tracker</h1>
    <form id="search-form">
      <input id="query" aria-label="IP address or domain"
        placeholder="Search for any IP address or domain">
      <button type="submit" aria-label="Search">&#10095;</button>
    </form>
    <p id="status" role="status"></p>
    <button id="sound" type="button" aria-pressed="false">Sound: off</button>
  </header>
  <main>
    <section class="details" aria-label="IP information">
      <article><h2>IP ADDRESS</h2><p id="ip">--</p></article>
      <article><h2>LOCATION</h2><p id="location">--</p></article>
      <article><h2>TIMEZONE</h2><p id="timezone">--</p></article>
      <article><h2>ISP</h2><p id="isp">--</p></article>
    </section>
    <div id="map" aria-label="Approximate IP location"></div>
  </main>
</body>
</html>
